# -*- conf -*-

font=DejaVuSansM Nerd Font Mono, Noto Color Emoji:size=8
font-bold=DejaVuSansM Nerd Font Mono:style=Bold:size=8
font-italic=DejaVuSansM Nerd Font Mono:style=Oblique:size=8
font-bold-italic=DejaVuSansM Nerd Font Mono:style=Bold Oblique:size=8

pad=10x10

bold-text-in-bright=no
gamma-correct-blending=yes

initial-color-theme=dark

## Monochromatic UI (docs/colorscheme.md)
# base00 000000  base01 0a0a0a  base02 1e1e1e  base03 434343
# base04 858585  base05 b2b2b2  base06 cfcfcf  base07 ffffff
#
## Semantic normal
# base08 bc336e red     base09 a75003 orange
# base0A 807704 yellow  base0B 367702 green
# base0C 068680 cyan    base0D 036ea6 blue
# base0E 4f5cd1 violet  base0F a340a6 magenta
#
## Semantic bright
# base10 ffa6c2 red     base11 ffaf7f orange
# base12 d3c850 yellow  base13 99d97c green
# base14 15e1d7 cyan    base15 89ccfe blue
# base16 b2c0fe violet  base17 f3a3f4 magenta

[colors-dark]
background=000000 # base00 bg
foreground=b2b2b2 # base05 fg
selection-background=1e1e1e # base02 selection
selection-foreground=ffffff # base07 fg-max

regular0=000000 # base00
regular1=ffa6c2 # base10 red-error (dark usa rango bright)
regular2=99d97c # base13 green-success
regular3=d3c850 # base12 yellow-warning
regular4=89ccfe # base15 blue
regular5=b2c0fe # base16 violet-link
regular6=15e1d7 # base14 cyan-info
regular7=b2b2b2 # base05

bright0=434343 # base03
bright1=ffa6c2 # base10 (dark: regular==bright, rango bright)
bright2=99d97c # base13
bright3=d3c850 # base12
bright4=89ccfe # base15
bright5=b2c0fe # base16
bright6=15e1d7 # base14
bright7=ffffff # base07

jump-labels=000000 d3c850 # base12 warning
scrollback-indicator=000000 15e1d7 # base14 info
search-box-no-match=000000 ffa6c2 # base10 error
search-box-match=000000 d3c850 # base12 warning
urls=b2c0fe # base16 link
flash=ffaf7f # base11 accent-dark

[colors-light]
background=ffffff # base07 bg
foreground=1e1e1e # base02 fg
selection-background=b2b2b2 # base05 selection
selection-foreground=000000 # base00 fg-max

regular0=000000 # base00
regular1=bc336e # base08 red-error
regular2=367702 # base0B green
regular3=807704 # base0A yellow
regular4=036ea6 # base0D blue
regular5=4f5cd1 # base0E violet
regular6=068680 # base0C cyan
regular7=858585 # base04 muted (ANSI dice base05 b2b2b2, adaptado para contraste sobre bg claro)

bright0=434343 # base03
bright1=bc336e # base08 red-error (light usa rango normal)
bright2=367702 # base0B green-success
bright3=807704 # base0A yellow-warning
bright4=036ea6 # base0D blue
bright5=4f5cd1 # base0E violet-link
bright6=068680 # base0C cyan-info
bright7=ffffff # base07

jump-labels=000000 807704 # base0A warning
scrollback-indicator=000000 068680 # base0C info
search-box-no-match=000000 bc336e # base08 error
search-box-match=000000 807704 # base0A warning
urls=4f5cd1 # base0E link
flash=036ea6 # base0D accent-light
dim-blend-towards=white

[key-bindings]
color-theme-toggle=Control+Shift+t

# vim: ft=dosini
