# -*- conf -*-

# For documentation on these options, see `man fnott.ini`

# Global values
output=DP-1
min-width=250
# max-width=0
# max-height=0
# stacking-order=bottom-up
# anchor=top-right
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=10
# icon-theme=hicolor
# max-icon-size=32
selection-helper=dmenu
# play-sound=aplay ${filename}
# layer=top

# Default values, may be overridden in 'urgency' specific sections
# chroma dark (docs/colorscheme.md): bg base00, border base03 muted,
# title base04 secondary, summary base06 highlight, body base05 fg,
# progress bar base11 dark accent (option name: progress-color; the older
# progress-bar-color is deprecated in fnott 1.8).
background=000000ff

border-color=434343ff
border-size=1

padding-vertical=20
padding-horizontal=20

# dpi-aware=auto

title-font=DejaVu Sans Mono
title-color=858585ff
title-format=<i>%a%A</i>

summary-font=DejaVu Sans Mono
summary-color=cfcfcfff
summary-format=<b>%s</b>\n

body-font=DejaVu Sans Mono
body-color=b2b2b2ff
body-format=%b

progress-bar-height=20
progress-color=ffaf7fff

# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
# max-timeout=0
# default-timeout=0
# idle-timeout=0

[low]
background=0a0a0aff
title-color=434343ff
summary-color=434343ff
body-color=434343ff

# [normal]

[critical]
background=000000ff
border-color=ffa6c2ff
title-color=ffa6c2ff
summary-color=cfcfcfff
body-color=b2b2b2ff
