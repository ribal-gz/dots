      path: ~/.config/yambar/scripts/workspaces.sh
      args: ['HDMI-A-2']
      content:
        - map:
            default:
              string: {text: "", margin: 8, foreground: 434343ff, on-click: "mmsg dispatch view,1"}
            conditions:
              "show1 && active1":
                string: {text: "", margin: 8, foreground: eab532ff, on-click: "mmsg dispatch view,1"}
              "show1 && urgent1":
                string: {text: "", margin: 8, foreground: ca6789ff, on-click: "mmsg dispatch view,1"}
              show1:
                string: {text: "", margin: 8, foreground: ffffffff, on-click: "mmsg dispatch view,1"}
