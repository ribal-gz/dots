.right: &right
  - script:
      path: ~/.config/yambar/scripts/updates.sh
      poll-interval: 60000
      content:
        string:
          text: " {output}"
          foreground: "088eafff"
          on-click: "footclient apk-menu"
  - label:
      content: {string: {text: " | ", foreground: "434343ff"}}
  - script:
      path: ~/.config/yambar/scripts/memory.sh
      poll-interval: 30000
      content:
        string:
          text: " {output}"
          foreground: "a47fc6ff"
          on-click: "footclient htop"
  - label:
      content: {string: {text: " | ", foreground: "434343ff"}}
  - clock:
      date-format: "%b %d (%a)"
      content:
        string:
          text: " {date}"
          foreground: "6e9a5dff"
  - label:
      content: {string: {text: " | ", foreground: "434343ff"}}
  - clock:
      time-format: "%I:%M%p"
      content:
        string:
          text: " {time}"
          foreground: "59aa90ff"

.bar: &bar
  location: top
  layer: top
  height: 30
  background: 000000ff
  foreground: b2b2b2ff
  font: "DejaVuSansM Nerd Font Mono:pixelsize=24"
  spacing: 6

  left: *left
  right: *right

bar:
  <<: *bar
  monitor: 'HDMI-A-2'
