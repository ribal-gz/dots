vo=gpu-next
gpu-api=vulkan
hwdec=auto
tone-mapping=bt.2390
hdr-compute-peak=yes
target-trc=bt.1886
target-prim=bt.709
osd-font=Inter
sub-font=Inter

# ModernZ (mpv/plugins/ModernZ, git submodule). Loaded by path on purpose:
# mpv auto-loads everything in scripts/, but only accepts a subdirectory that
# has a main.* entry point, and ModernZ names its entry point modernz.lua.
# Keeping it under plugins/ (like zsh/plugins/) leaves the scan alone and
# keeps the submodule working tree untouched.
scripts=~~/plugins/ModernZ/modernz.lua

# ModernZ positions subtitles itself (its sub_margins option), so remembering
# mpv's own sub-pos fights it. ModernZ warns about this on every launch.
watch-later-options-remove=sub-pos

# chroma, dark variant (docs/colorscheme.md)
#
# mpv has no theme system, so this is the whole surface it exposes: 11 color
# options covering the OSD, subtitles and the background visualizer. Format is
# #AARRGGBB, alpha first, hence the leading FF (opaque) and AF (68%).

# --- Subtitles ---
# Video content is unpredictable, so subtitles stay at fg-max with the outline
# at bg. These match mpv's defaults; they are spelled out because base07 is
# the palette's designated high-contrast color and this is its job.
sub-color="#FFFFFFFF"
sub-outline-color="#FF000000"
sub-back-color="#AF000000"

# --- OSD ---
# Volume, pause, seek bar, and the highlight in the track menus.
osd-color="#FFFFFFFF"
osd-outline-color="#FF000000"
osd-back-color="#AF0A0A0A"
# mpv defaults this to a yellow. Same rule as starship and mango: no yellow
# for plain UI, the accent is the one semantic color allowed there.
osd-selected-color="#FFFFAF7F"
osd-selected-outline-color="#FF000000"

# --- Background ---
# Used with background=none, and by the audio visualizer when background=tiles.
background-color="#FF000000"
# mpv ships these near-white. On a dark scheme that is blinding, so the audio
# tiles become a monochrome waveform instead.
background-tile-color-0="#FFB2B2B2"
background-tile-color-1="#FF858585"