# chroma theme for ModernZ (docs/colorscheme.md), dark variant.
# ModernZ reads ~~/script-opts/modernz.conf automatically; no mpv.conf entry
# needed. Colors must be exactly #RRGGBB, the script warns on anything else.

# --- requested --------------------------------------------------------------

# Compact OSC: only the essentials.
layout=mini

# Material Design icons, outline weight. icon_theme picks the family and
# icon_style picks filled vs outline; "material outline" is both of these.
icon_theme=material
icon_style=outline

# Thinner seekbar.
seekbar_height=small

# Chapter markers as gaps cut into the seekbar rather than triangles.
nibbles_style=gap

# --- surfaces ---------------------------------------------------------------

# OSC panel. base01 rather than pure black so the panel reads as a surface
# sitting above the video.
osc_color=#0a0a0a

# Thumbnail panel: base02 selection with a base03 outline.
thumbnail_box_color=#1e1e1e
thumbnail_box_outline=#434343

# --- text -------------------------------------------------------------------

# The title is the most prominent text on screen, so it gets fg-highlight and
# everything else steps down from there.
title_color=#cfcfcf
time_color=#b2b2b2
window_title_color=#b2b2b2
chapter_title_color=#b2b2b2

# Cache readout is metadata, so it stays secondary.
cache_info_color=#858585

# --- controls ---------------------------------------------------------------

# Play/pause is the primary action, so it leads; the rest are secondary UI.
playpause_color=#cfcfcf
side_buttons_color=#858585
middle_buttons_color=#858585
window_controls_color=#858585
held_element_color=#858585

# Window control hovers. Only close gets a semantic color, because "this
# destroys the window" is information. Maximize and minimize are told apart by
# their glyphs, so they stay monochrome; the palette reserves yellow for
# warnings and spending it on "maximize" would be a misuse. To get the
# traffic-light look back, set these to #d3c850 (max) and #99d97c (min).
windowcontrols_close_hover=#ffa6c2
windowcontrols_max_hover=#cfcfcf
windowcontrols_min_hover=#858585

# --- accent -----------------------------------------------------------------

# base11 is the one semantic color allowed as general UI, and ModernZ already
# defaults its highlights to orange. Progress, hover and the handle ring.
seekbarfg_color=#ffaf7f
seek_handle_border_color=#ffaf7f
hover_effect_color=#ffaf7f

# --- seekbar ----------------------------------------------------------------

# Unplayed portion. base03 would be invisible here (2.00 against the base01
# panel), so the bar background sits at base04.
seekbarbg_color=#858585

# The drag handle needs to be unmistakable, so it takes fg-max.
seek_handle_color=#ffffff

# Chapter structure, monochrome so it does not compete with the accent
# progress; the chapter you are inside is picked out one step brighter.
nibble_color=#858585
nibble_current_color=#cfcfcf

# --- information ------------------------------------------------------------

# Cached range is background, not text: muted.
seekbar_cache_color=#434343

# The A-B loop range is genuinely information (this span is special), so it
# gets cyan rather than more monochrome.
ab_loop_color=#15e1d7