# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,bemenu-run -p ❯
bind=SUPER,Return,spawn,footclient

# commands
bind=SUPER,b,spawn,app.zen_browser.zen
bind=SUPER,e,spawn,footclient nnn
bind=SUPER,Escape,spawn,power-menu
bind=SUPER,n,spawn,fnott-menu

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER,q,killclient,

# switch window focus
bind=ALT,Tab,focusstack,next
bind=ALT,h,focusdir,left
bind=ALT,l,focusdir,right
bind=ALT,k,focusdir,up
bind=ALT,j,focusdir,down

# swap window
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,h,scroller_stack,left
bind=alt+super+ctrl,l,scroller_stack,right
bind=alt+super+ctrl,k,scroller_stack,up
bind=alt+super+ctrl,j,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch
bind=SUPER,h,viewtoleft,0
bind=CTRL+SUPER,h,viewtoleft_have_client,0
bind=SUPER,l,viewtoright,0
bind=CTRL+SUPER,l,viewtoright_have_client,0
bind=SUPER+SHIFT,h,tagtoleft,0
bind=SUPER+SHIFT,l,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# groups
bind=Alt+CTRL,k,groupjoin,up
bind=Alt+CTRL,j,groupjoin,down
bind=Alt+CTRL,h,groupjoin,left
bind=Alt+CTRL,l,groupjoin,right
bind=Alt+CTRL,comma,groupfocus,prev
bind=Alt+CTRL,period,groupfocus,next
bind=Alt+CTRL,space,groupleave

# monitor switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=ALT+SHIFT,comma,tagmon,left
bind=ALT+SHIFT,period,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=ALT+CTRL+SHIFT,k,movewin,+0,-50
bind=ALT+CTRL+SHIFT,j,movewin,+0,+50
bind=ALT+CTRL+SHIFT,h,movewin,-50,+0
bind=ALT+CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+SHIFT,k,resizewin,+0,-50
bind=CTRL+SHIFT,j,resizewin,+0,+50
bind=CTRL+SHIFT,h,resizewin,-50,+0
bind=CTRL+SHIFT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layouts
bind=ALT,space,switch_layout
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle
bind=SUPER,s,setlayout,scroller
bind=SUPER,v,setlayout,vertical_scroller
bind=SUPER,d,setlayout,dwindle
