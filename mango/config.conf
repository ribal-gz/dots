# Window effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration
# tag_animation_direction: 1-horizontal, 0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=catppuccin-mocha-rosewater-cursors
cursor_hide_timeout=5
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us
xkb_rules_options=compose:ralt

# Trackpad
# need relogin to make it apply
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
swipe_min_threshold=1
mouse_middle_button_emulation=0
mouse_natural_scrolling=0
mouse_left_handed=0
mouse_accel_profile=2
mouse_accel_speed=0.0

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# tablet
devicerule=type:tablet,monitor:HDMI-A-2

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

# Colorscheme: chroma (dark)
#   base00 000000  base01 0a0a0a  base02 1e1e1e  base03 434343
#   base04 858585  base05 b2b2b2  base06 cfcfcf  base07 ffffff
#   base08 ca6789  base09 da8472  base0A eab532  base0B 6e9a5d
#   base0C 59aa90  base0D 088eaf  base0E 6f5fc3  base0F a47fc6
rootcolor=0x000000ff          # base00 bg
bordercolor=0x434343ff        # base03 muted (inactive border)
dropcolor=0x6e9a5d55          # base0B green (drag border, translucent)
splitcolor=0xda8472ff         # base09 orange (manual split)
focuscolor=0xeab532ff         # base0A accent (active border)
maximizescreencolor=0x6e9a5dff # base0B green
urgentcolor=0xca6789ff        # base08 red
scratchpadcolor=0x088eafff    # base0D blue
globalcolor=0xa47fc6ff        # base0F magenta
overlaycolor=0x59aa90ff       # base0C cyan

# sub config load
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# run autostart
exec-once=~/.winitrc

# Monocle tabs
group_bar_height = 25
group_bar_decorate_fg_color=0xb2b2b2ff        # base05 fg
group_bar_decorate_bg_color=0x0a0a0aff        # base01 surface
group_bar_decorate_focus_fg_color=0x000000ff  # base00 on accent
group_bar_decorate_focus_bg_color=0xeab532ff  # base0A accent
group_bar_decorate_border_color=0x434343ff    # base03 muted
group_bar_decorate_border_width = 2
group_bar_decorate_corner_radius = 0
group_bar_decorate_padding_x = 0
group_bar_decorate_padding_y = 0
group_bar_decorate_font_desc = DejaVu Mono NF CN Bold 8

# Overview jump labels
jump_label_decorate_fg_color=0xb2b2b2ff        # base05 fg
jump_label_decorate_bg_color=0x1e1e1eff        # base02 selection
jump_label_decorate_focus_fg_color=0x000000ff  # base00 on accent
jump_label_decorate_focus_bg_color=0xeab532ff  # base0A accent
jump_label_decorate_border_color=0x434343ff    # base03 muted
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=6
jump_label_decorate_padding_x=10
jump_label_decorate_padding_y=10
jump_label_decorate_font_desc=DejaVu Mono NF CN Bold 12
